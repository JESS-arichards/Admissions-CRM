name: Diagnose Admissions development startup
on:
  push:
    branches: [development]
    paths:
      - .github/workflows/development_diagnostics.yml
  workflow_dispatch:
    inputs:
      sync_shared_settings:
        description: Copy the Portal's shared Entra, Graph and mail settings to Admissions development
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5529A7BE1E4A4E16B4016DE1EFD941C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_37920CDA620E49D5A242A07097CDF52F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_287F7E66FDFB4243BD22FD3A88C4C8CE }}
      - name: Compare shared settings with the Portal without disclosing values
        shell: bash
        env:
          SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_shared_settings }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          SHARED = [
              "ENTRA_TENANT_ID", "ENTRA_CLIENT_ID", "ENTRA_CLIENT_SECRET", "ENTRA_ALLOWED_DOMAINS",
              "GRAPH_TENANT_ID", "GRAPH_CLIENT_ID", "GRAPH_CLIENT_SECRET", "MAIL_FROM_ADDRESS", "INITIAL_ADMIN_EMAIL",
          ]

          def azure(*args):
              result = subprocess.run(["az", *args, "--only-show-errors", "-o", "json"], capture_output=True, text=True, timeout=120)
              if result.returncode:
                  print("::error::Azure operation failed; response withheld to protect credentials.")
                  sys.exit(1)
              return json.loads(result.stdout) if result.stdout.strip() else None

          apps = {item["name"]: item for item in azure("webapp", "list")}
          missing_apps = [name for name in ("jess-application-portal-dev", "jess-admissions-dev") if name not in apps]
          if missing_apps:
              print("::error::The deployment identity cannot see:", ", ".join(missing_apps))
              sys.exit(1)

          def settings(name):
              target = ["--name", name, "--resource-group", apps[name]["resourceGroup"]]
              values = {item["name"]: (item.get("value") or "").strip() for item in azure("webapp", "config", "appsettings", "list", *target)}
              for key in SHARED:
                  value = values.get(key, "")
                  if len(value) >= 4:
                      print(f"::add-mask::{value}", flush=True)
              return target, values

          _, portal = settings("jess-application-portal-dev")
          target, admissions = settings("jess-admissions-dev")
          differences = []
          print("Setting | Portal | Admissions | Same")
          for key in SHARED:
              same = portal.get(key, "") == admissions.get(key, "")
              if not same:
                  differences.append(key)
              print(f"{key} | {'set' if portal.get(key) else 'unset'} | {'set' if admissions.get(key) else 'unset'} | {'yes' if same else 'NO'}")

          if os.environ.get("SYNC") == "true" and differences:
              updates = [f"{key}={portal[key]}" for key in differences if portal.get(key)]
              removals = [key for key in differences if not portal.get(key)]
              if updates:
                  azure("webapp", "config", "appsettings", "set", *target, "--settings", *updates)
              if removals:
                  azure("webapp", "config", "appsettings", "delete", *target, "--setting-names", *removals)
              print("Synchronised from the Portal:", ", ".join(differences))
          elif differences:
              print("::warning::Shared settings differ from the Portal:", ", ".join(differences))
          else:
              print("All shared Entra, Graph and mail settings match the Portal.")
          PY
      - name: Inspect startup without disclosing credentials
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          import zipfile

          def azure(*args):
              result = subprocess.run(["az", *args, "--only-show-errors", "-o", "json"], capture_output=True, text=True, timeout=120)
              if result.returncode:
                  raise RuntimeError("Azure diagnostic operation failed; response withheld to protect credentials.")
              return json.loads(result.stdout) if result.stdout.strip() else None

          app = next(item for item in azure("webapp", "list") if item["name"] == "jess-admissions-dev")
          target = ["--name", app["name"], "--resource-group", app["resourceGroup"]]
          config = azure("webapp", "config", "show", *target)
          print("Runtime:", config.get("linuxFxVersion") if re.fullmatch(r"NODE\|[\d\w.-]+", config.get("linuxFxVersion", ""), re.I) else "not a recognised Node runtime")
          command = config.get("appCommandLine", "").strip()
          print("Startup command:", command if command in ("", "npm start", "node dist/server/index.js") else "custom command present (withheld)")
          settings = {item["name"]: item.get("value", "") for item in azure("webapp", "config", "appsettings", "list", *target)}
          for key in ("PLATFORM_API_KEY", "SESSION_SECRET"):
              print(key + " length valid:", len(settings.get(key, "")) >= 32)
          for key in ("ENTRA_TENANT_ID", "ENTRA_CLIENT_ID"):
              print(key + " UUID format valid:", bool(re.fullmatch(r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", settings.get(key, ""))))
          print("NODE_ENV production:", settings.get("NODE_ENV") == "production")
          print("Graph email settings complete or disabled:", sum(bool(settings.get(key)) for key in ("GRAPH_CLIENT_SECRET", "MAIL_FROM_ADDRESS")) in (0, 2))
          for key in ("GRAPH_TENANT_ID", "GRAPH_CLIENT_ID", "GRAPH_CLIENT_SECRET", "MAIL_FROM_ADDRESS"):
              print(key + " configured:", bool(settings.get(key, "").strip()))
          import base64
          import urllib.parse
          import urllib.request
          graph_tenant = settings.get("GRAPH_TENANT_ID") or settings.get("ENTRA_TENANT_ID", "")
          graph_client = settings.get("GRAPH_CLIENT_ID") or settings.get("ENTRA_CLIENT_ID", "")
          graph_secret = settings.get("GRAPH_CLIENT_SECRET", "")
          if graph_tenant and graph_client and graph_secret:
              try:
                  body = urllib.parse.urlencode({"client_id": graph_client, "client_secret": graph_secret, "grant_type": "client_credentials", "scope": "https://graph.microsoft.com/.default"}).encode()
                  with urllib.request.urlopen(urllib.request.Request(f"https://login.microsoftonline.com/{urllib.parse.quote(graph_tenant)}/oauth2/v2.0/token", data=body), timeout=30) as response:
                      token = json.loads(response.read())["access_token"]
                  payload = token.split(".")[1]
                  claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
                  print("Graph token acquired with effective tenant/client:", True)
                  print("Graph Mail.Send application permission granted:", "Mail.Send" in claims.get("roles", []))
              except Exception as error:
                  code = getattr(error, "code", None)
                  detail = ""
                  try:
                      detail = ", ".join(sorted(set(re.findall(r"AADSTS\d+", error.read().decode("utf-8", "replace")))))
                  except Exception:
                      pass
                  print("Graph token acquired with effective tenant/client:", False, f"(HTTP {code}) {detail}" if code else "")
          categories = [
              "ERR_MODULE_NOT_FOUND", "MODULE_NOT_FOUND", "ZodError", "ELOGIN", "ETIMEOUT", "ECONNREFUSED",
              "ENOTFOUND", "Login failed for user", "Cannot find module", "Missing script",
              "Admissions could not start", "Invalid environment", "Could not acquire Admissions migration lock",
              "SQL authentication requires", "Configure both GRAPH_CLIENT_SECRET and MAIL_FROM_ADDRESS",
              "Failed to connect", "CREATE TABLE permission denied", "CREATE DATABASE permission denied",
          ]
          with tempfile.TemporaryDirectory() as directory:
              archive = os.path.join(directory, "logs.zip")
              try:
                  azure("webapp", "log", "download", *target, "--log-file", archive)
                  found = set()
                  latest = None
                  with zipfile.ZipFile(archive) as logs:
                      entries = [info for info in logs.infolist() if not info.is_dir() and info.file_size <= 20000000]
                      for info in sorted(entries, key=lambda item: item.date_time):
                          text = logs.read(info.filename).decode("utf-8", errors="replace")
                          found.update(category for category in categories if category in text)
                          for line in text.splitlines():
                              if "Admissions could not start" in line:
                                  latest = (info.date_time, line)
                  print("Recognised startup error categories (all retained logs):", ", ".join(sorted(found)) or "none")
                  if latest:
                      line = latest[1]
                      try:
                          err = json.loads(line[line.index("{"):]).get("err", {})
                      except Exception:
                          err = {}
                      def redact(value):
                          value = re.sub(r"(?i)(password|pwd|secret|key|token|sig)=[^;&\s]+", r"\1=<redacted>", str(value))
                          return re.sub(r"[A-Za-z0-9+/_-]{32,}={0,2}", "<redacted>", value)[:300]
                      print("Latest startup failure log time:", "-".join(str(part) for part in latest[0]))
                      print("Latest startup failure type/code:", redact(err.get("type") or err.get("name")), redact(err.get("code")))
                      print("Latest startup failure message:", redact(err.get("message", "unparsed")))
              except Exception:
                  print("Startup log archive unavailable; no raw logs or credentials were printed.")
          PY
