# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - jess-admissions-dev

on:
  push:
    branches:
      - 'development'
  workflow_dispatch:

concurrency:
  group: admissions-development
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Validate and package application
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm prune --omit=dev
          tar -czf deployment.tar.gz dist node_modules package.json package-lock.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: admissions-development
          path: deployment.tar.gz
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: admissions-development

      - name: Extract runtime package
        run: |
          mkdir deployment
          tar -xzf deployment.tar.gz -C deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5529A7BE1E4A4E16B4016DE1EFD941C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_37920CDA620E49D5A242A07097CDF52F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_287F7E66FDFB4243BD22FD3A88C4C8CE }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jess-admissions-dev'
          slot-name: 'Production'
          package: deployment

      - name: Verify development health
        shell: bash
        run: |
          set -euo pipefail
          host=$(az webapp list --query "[?name=='jess-admissions-dev'].defaultHostName | [0]" -o tsv)
          if [ -z "$host" ]; then
            echo "::error::Could not resolve the development web app hostname."
            exit 1
          fi
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --max-time 20 "https://$host/api/health"