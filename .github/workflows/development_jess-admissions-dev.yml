# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - jess-admissions-dev

on:
  push:
    branches:
      - 'development'
  workflow_dispatch:
    inputs:
      configure_runtime:
        description: Configure the approved development Portal URL and generate SESSION_SECRET only if missing
        type: boolean
        default: false

concurrency:
  group: admissions-development
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Validate and package application
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm prune --omit=dev
          tar -czf deployment.tar.gz dist node_modules package.json package-lock.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: admissions-development
          path: deployment.tar.gz
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: admissions-development

      - name: Extract runtime package
        run: |
          mkdir deployment
          tar -xzf deployment.tar.gz -C deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5529A7BE1E4A4E16B4016DE1EFD941C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_37920CDA620E49D5A242A07097CDF52F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_287F7E66FDFB4243BD22FD3A88C4C8CE }}

      - name: Enable development SQL serverless mode and liveness health check
        shell: bash
        run: |
          set -euo pipefail
          app_name='jess-admissions-dev'
          if ! groups=$(az webapp list --query "[?name=='${app_name}'].resourceGroup" -o tsv --only-show-errors 2>/dev/null); then
            echo "::error::Could not list App Services. Check the deployment identity's read permissions."
            exit 1
          fi
          count=$(printf '%s\n' "$groups" | sed '/^$/d' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one ${app_name} App Service; found ${count}."
            exit 1
          fi
          if ! az webapp config appsettings set --name "$app_name" --resource-group "$groups" \
            --settings SQL_SERVERLESS_ENABLED=true --only-show-errors --output none >/dev/null 2>&1; then
            echo "::error::Could not set SQL_SERVERLESS_ENABLED on ${app_name}. Check the deployment identity's App Service write permissions."
            exit 1
          fi
          if ! az webapp config set --name "$app_name" --resource-group "$groups" \
            --generic-configurations '{"healthCheckPath":"/api/live"}' --only-show-errors --output none >/dev/null 2>&1; then
            echo "::error::Could not set the ${app_name} Health check path. Check the deployment identity's App Service write permissions."
            exit 1
          fi
          echo "Enabled development SQL serverless mode and the /api/live Health check on ${app_name}."

      - name: Configure approved development runtime settings
        if: github.event_name == 'workflow_dispatch' && inputs.configure_runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          import secrets
          import subprocess
          import sys

          def azure(*args):
              result = subprocess.run(
                  ["az", *args, "--only-show-errors", "-o", "json"],
                  capture_output=True, text=True,
              )
              if result.returncode:
                  print("::error::Could not configure development runtime settings with the deployment identity.")
                  sys.exit(1)
              return json.loads(result.stdout) if result.stdout.strip() else None

          app = next((item for item in azure("webapp", "list") if item["name"] == "jess-admissions-dev"), None)
          if not app:
              print("::error::Development App Service was not found.")
              sys.exit(1)
          target = ["--name", app["name"], "--resource-group", app["resourceGroup"]]
          current = azure("webapp", "config", "appsettings", "list", *target)
          configured = {item["name"] for item in current if item.get("value", "").strip()}
          settings = ["APPLICATIONS_PORTAL_URL=https://appsdev.jess.sch.ae"]
          if "SESSION_SECRET" not in configured:
              secret = secrets.token_urlsafe(48)
              print(f"::add-mask::{secret}", flush=True)
              settings.append(f"SESSION_SECRET={secret}")
          azure("webapp", "config", "appsettings", "set", *target, "--settings", *settings)
          print("Approved development Portal URL configured; independent session secret is present. No existing session secret was replaced.")
          PY

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jess-admissions-dev'
          slot-name: 'Production'
          package: deployment

      - name: Diagnose runtime configuration
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          def azure(*args):
              result = subprocess.run(
                  ["az", *args, "--only-show-errors", "-o", "json"],
                  capture_output=True, text=True,
              )
              if result.returncode:
                  print("::error::Could not inspect development configuration with the deployment identity.")
                  sys.exit(1)
              return json.loads(result.stdout)

          apps = azure("webapp", "list")
          app = next((item for item in apps if item["name"] == "jess-admissions-dev"), None)
          if not app:
              print("::error::Development App Service was not found.")
              sys.exit(1)
          settings = azure(
              "webapp", "config", "appsettings", "list",
              "--name", app["name"], "--resource-group", app["resourceGroup"],
          )
          configured = {item["name"] for item in settings if item.get("value", "").strip()}
          required = {
              "NODE_ENV", "PUBLIC_BASE_URL", "APPLICATIONS_PORTAL_URL",
              "PLATFORM_API_KEY", "SESSION_SECRET", "ENTRA_TENANT_ID", "ENTRA_CLIENT_ID",
          }
          missing = sorted(required - configured)
          if not ({"SQL_CONNECTION_STRING", "SQLAZURECONNSTR_DefaultConnection"} & configured):
              missing += sorted({"SQL_SERVER", "SQL_DATABASE"} - configured)
          for name in missing:
              print(f"::error::Missing required App Service setting: {name}")
          if missing:
              print("::error::Configure the development settings described in README.md, then rerun deployment.")
              sys.exit(1)
          print("Required runtime setting names are present; credential validity and database connectivity still require startup validation.")
          PY

      - name: Verify development health
        shell: bash
        run: |
          set -euo pipefail
          host=$(az webapp list --query "[?name=='jess-admissions-dev'].defaultHostName | [0]" -o tsv)
          if [ -z "$host" ]; then
            echo "::error::Could not resolve the development web app hostname."
            exit 1
          fi
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --max-time 20 "https://$host/api/live"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --max-time 20 "https://$host/api/health"